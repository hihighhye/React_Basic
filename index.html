        // #Method 2. JSX - The most commonly used nowadays -> Babel(interpreter)
        function Title() {
            return (
                <h3 id="title" onMouseEnter={() => console.log("mouse enter")}>
                    Hello, I'm a span!
                </h3>
            ); 
        }

        const Button = () => (
            <button style={{backgroundColor: "tomato"}} 
                    onClick={() => console.log("I'm clicked!")}>
                Click me
            </button>
        );

        const Container = (
